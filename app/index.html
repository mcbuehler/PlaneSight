<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane Sight</title>
<link rel="icon" href="data:,">
</head>
<body>
<header class="view-bar">
  <button id="switch-view" type="button" aria-controls="herdr-view">Herdr →</button>
  <div class="view-heading" id="view-heading" hidden><strong>Herdr</strong><span id="view-session"></span></div>
</header>
<div class="airport-banner" id="airport-banner">
  <img id="airport-sign" alt="Agent Airport International — AAI" width="1968" height="799">
</div>
<div class="viewport">
  <main class="stage" id="stage" aria-label="Airport">
    <div id="game"></div>
    <div class="tower-control" id="tower">
      <button class="tower-trigger" id="tower-toggle" type="button" aria-label="About the tower: Gemini 3.8 Flash" aria-expanded="false" aria-controls="tower-info">
        <img class="tower-sparkle" src="/src/assets/gemini-pixel.svg" alt="" width="36" height="36">
        <span class="tower-twinkle" aria-hidden="true">+</span>
        <span class="tower-caption">Tower</span>
      </button>
      <div class="tower-card" id="tower-info" hidden>
        <div class="tower-brand">
          <img src="/src/assets/gemini-pixel.svg" alt="" width="28" height="28">
          <strong>Gemini 3.8 Flash</strong>
        </div>
        <p>Your air traffic controller</p>
      </div>
    </div>
    <p class="overflow-label" id="overflow"></p>
    <p class="flight-label" id="flight"></p>
    <img class="logo" id="logo" alt="Plane Sight">
    <div id="bubble"></div>
  </main>
</div>
<section id="herdr-view" class="herdr-view" aria-label="Herdr session" hidden>
  <div id="herdr-frame-host" class="herdr-frame-host"></div>
</section>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
